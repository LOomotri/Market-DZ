<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Market DZ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Tahoma,sans-serif;background:#f5f6f7;color:#222}
header{background:#004d35;padding:18px;color:white}
.top{max-width:1100px;margin:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{font-size:26px;font-weight:bold}
.search{flex:1;min-width:200px}
.search input{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;outline:none}
.account{background:white;color:#006b48;border:0;padding:13px 20px;border-radius:11px;font-weight:bold;cursor:pointer}
.condition-bar{max-width:1100px;margin:15px auto 5px;display:flex;gap:10px;padding:5px}
.condition-bar button{flex:1;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;background:white;color:#004d35}
.condition-bar button.active{background:#008653;color:white}
.categories{max-width:1100px;margin:5px auto 15px;display:flex;gap:9px;overflow-x:auto;padding:5px}
.categories button{background:white;border:0;padding:11px 18px;border-radius:22px;white-space:nowrap;cursor:pointer}
.categories button.active{background:#008653;color:white}
.container{max-width:1100px;margin:auto;padding:10px}
.publish{background:#ff7100;color:white;border:0;padding:15px 25px;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer;margin:10px 0 25px}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px #0001;position:relative}
.card img{width:100%;height:190px;object-fit:cover}
.badge-cond{position:absolute;top:8px;right:8px;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:bold;color:white}
.badge-cond.new{background:#008653}
.badge-cond.used{background:#ff7100}
.info{padding:13px}
.title{font-size:17px;font-weight:bold;margin-bottom:8px}
.price{font-size:20px;font-weight:bold;color:#008653}
.location{color:#777;font-size:14px;margin:8px 0}
.view{width:100%;border:0;background:#006b48;color:white;padding:12px;border-radius:9px;cursor:pointer;font-size:15px}
.empty{text-align:center;padding:70px 20px;color:#777;font-size:18px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:100;align-items:center;justify-content:center;padding:15px}
.box{background:white;width:100%;max-width:600px;max-height:90vh;overflow:auto;border-radius:20px;padding:22px}
.box h2{margin-bottom:18px}
.close{float:left;border:0;background:#eee;width:36px;height:36px;border-radius:50%;font-size:22px;cursor:pointer}
.field{margin:12px 0}
.field label{display:block;margin-bottom:6px;font-weight:bold}
.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px}
.field textarea{height:100px;resize:none}
.submit{width:100%;border:0;background:#008653;color:white;padding:14px;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.preview img{width:90px;height:90px;object-fit:cover;border-radius:9px}
.product-image{width:100%;max-height:350px;object-fit:contain;border-radius:12px;margin:15px 0}
.review{background:#f4f4f4;padding:12px;border-radius:10px;margin:8px 0}
.delete{background:#d32f2f;color:white;border:0;padding:11px;border-radius:8px;cursor:pointer;margin-top:12px;width:100%;font-size:16px;font-weight:bold}
.menu-item{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#f4f4f4;border-radius:12px;margin-bottom:10px;cursor:pointer;font-weight:bold}
.chat-item{display:flex;gap:10px;align-items:center;padding:12px;background:#f4f4f4;border-radius:12px;margin-bottom:8px;cursor:pointer}
.chat-item img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.chat-item .msg-preview{color:#777;font-size:13px}
.chat-window{height:350px;overflow-y:auto;padding:10px;background:#f4f4f4;border-radius:12px;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.msg-me,.msg-other{max-width:75%;padding:10px 14px;border-radius:14px;font-size:14px;word-wrap:break-word}
.msg-me{background:#008653;color:white;align-self:flex-start}
.msg-other{background:white;color:#222;align-self:flex-end;border:1px solid #eee}
.chat-input{display:flex;gap:8px}
.chat-input input{flex:1;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:15px}
.chat-input button{background:#008653;color:white;border:0;padding:12px 20px;border-radius:10px;font-weight:bold;cursor:pointer}
.badge{background:#d32f2f;color:white;padding:2px 8px;border-radius:10px;font-size:12px;margin-right:6px}
@media(max-width:800px){.products{grid-template-columns:repeat(2,1fr)}}
@media(max-width:450px){.card img{height:155px}}
</style>
</head>
<body>

<header>
<div class="top">
<div class="logo">🇩🇿 Market DZ</div>
<div class="search"><input id="search" type="search" placeholder="ابحث عن منتج..." oninput="searchProducts()"></div>
<button class="account" onclick="openAccountMenu()">حسابي</button>
</div>
</header>

<div class="condition-bar">
<button id="condAll" onclick="filterCondition('الكل')">🛒 الكل</button>
<button id="condNew" class="active" onclick="filterCondition('جديد')">✨ جديد</button>
<button id="condUsed" onclick="filterCondition('مستعمل')">♻️ مستعمل</button>
</div>

<div class="categories" id="categoriesBar">
<button class="active" onclick="filterCategory('الكل', this)">الكل</button>
<button onclick="filterCategory('إلكترونيات', this)">📱 إلكترونيات</button>
<button onclick="filterCategory('ملابس', this)">👕 ملابس</button>
<button onclick="filterCategory('أثاث', this)">🛋️ أثاث</button>
<button onclick="filterCategory('مطبخ', this)">🍳 مطبخ</button>
<button onclick="filterCategory('منزل', this)">🏠 منزل</button>
<button onclick="filterCategory('ألعاب', this)">🎮 ألعاب</button>
</div>

<main class="container">
<button class="publish" onclick="openPublish()">➕ نشر منتج</button>
<div id="products" class="products"></div>
</main>

<div id="publishModal" class="modal"><div class="box">
<button class="close" onclick="closeModal('publishModal')">×</button>
<h2>نشر منتج</h2>
<div class="field"><label>اسم المنتج</label><input id="pName" type="text"></div>
<div class="field"><label>السعر</label><input id="pPrice" type="number"></div>
<div class="field"><label>الحالة</label><select id="pCondition"><option value="جديد">✨ جديد</option><option value="مستعمل">♻️ مستعمل</option></select></div>
<div class="field"><label>القسم</label><select id="pCategory"><option>إلكترونيات</option><option>ملابس</option><option>أثاث</option><option>مطبخ</option><option>منزل</option><option>ألعاب</option></select></div>
<div class="field"><label>الولاية</label><input id="pLocation" type="text"></div>
<div class="field"><label>الوصف</label><textarea id="pDescription"></textarea></div>
<div class="field"><label>الصور</label><input id="pImages" type="file" accept="image/*" multiple onchange="previewImages(event)"><div id="preview" class="preview"></div></div>
<button class="submit" onclick="publishProduct()">نشر</button>
</div></div>

<div id="loginModal" class="modal"><div class="box">
<button class="close" onclick="closeModal('loginModal')">×</button>
<div style="display:flex;gap:8px;margin-bottom:20px;">
<button id="tabLogin" class="submit" style="background:#008653;" onclick="switchAuthTab('login')">دخول</button>
<button id="tabRegister" class="submit" style="background:#ccc;color:#333;" onclick="switchAuthTab('register')">حساب جديد</button>
</div>
<div id="loginForm">
<div class="field"><label>رقم الهاتف</label><input id="phone" type="tel" placeholder="0550123456"></div>
<div class="field"><label>كلمة المرور</label><input id="password" type="password"></div>
<button class="submit" onclick="login()">دخول</button>
</div>
<div id="registerForm" style="display:none;">
<div class="field"><label>الاسم</label><input id="regName" type="text"></div>
<div class="field"><label>رقم الهاتف</label><input id="regPhone" type="tel" placeholder="0550123456"></div>
<div class="field"><label>كلمة المرور</label><input id="regPassword" type="password"></div>
<div class="field"><label>تأكيد كلمة المرور</label><input id="regPassword2" type="password"></div>
<div class="field"><label>OTP</label>
<div style="display:flex;gap:8px;">
<input id="otpCode" type="text" maxlength="6" style="flex:1;text-align:center;letter-spacing:6px;font-weight:bold;">
<button type="button" class="submit" style="width:auto;padding:13px 18px;background:#ff7100;" onclick="sendOtp('regPhone','otpStatus')">إرسال</button>
</div>
<small id="otpStatus" style="color:#777;"></small>
</div>
<button class="submit" onclick="register()">إنشاء</button>
</div>
</div></div>

<div id="accountModal" class="modal"><div class="box">
<button class="close" onclick="closeModal('accountModal')">×</button>
<div style="text-align:center;margin-bottom:20px;">
<img id="menuAvatar" src="https://via.placeholder.com/100/008653/ffffff?text=👤" style="width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid #008653;">
<h2 id="menuName">المستخدم</h2>
<p id="menuPhone" style="color:#777;"></p>
</div>
<div class="menu-item" onclick="closeModal('accountModal');openProfile()"><span>👤 الملف الشخصي</span><span>›</span></div>
<div class="menu-item" onclick="closeModal('accountModal');openSettings()"><span>⚙️ الإعدادات</span><span>›</span></div>
<div class="menu-item" onclick="closeModal('accountModal');openPrivacy()"><span>🔒 الخصوصية</span><span>›</span></div>
<div class="menu-item" onclick="closeModal('accountModal');openOrders()"><span>📦 منتجاتي</span><span>›</span></div>
<div class="menu-item" onclick="closeModal('accountModal');openMessages()"><span>💬 الرسائل</span><span><span id="unreadBadge" class="badge" style="display:none;">0</span>›</span></div>
<div class="menu-item" onclick="closeModal('accountModal');openAppSettings()"><span>🛠️ إعدادات التطبيق</span><span>›</span></div>
<button class="delete" style="background:#555;margin-top:15px;" onclick="logout()">🚪 خروج</button>
</div></div>

<div id="profileModal" class="modal"><div class="box">
<button class="close" onclick="closeModal('profileModal')">×</button>
<h2>👤 الملف الشخصي</h2>
<div style="text-align:center;">
<img id="profileAvatar" src="https://via.placeholder.com/100/008653/ffffff?text=👤" style="width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid #008653;">
<div class="field"><label>الصورة</label><input type="file" accept="image/*" onchange="changeAvatar(event)"></div>
</div>
<div class="field"><label>الاسم</label><input id="profileName" type="text"></div>
<button class="submit" onclick="saveProfile()">حفظ</button>
</div></div>

<div id="settingsModal" class="modal"><div class="box">
<button class="close" onclick="closeModal('settingsModal')">×</button>
<h2>⚙️ الإعدادات</h2>
<div class="field"><label>رقم الهاتف</label><input id="setPhone" type="tel"></div>
<button class="submit" onclick="savePhone()">حفظ الرقم</button>
<hr style="margin:20px 0;">
<div class="field"><label>كلمة المرور الجديدة</label><input id="setPassword" type="password"></div>
<div class="field"><label>OTP</label>
<div style="display:flex;gap:8px;">
<input id="setOtpCode" type="text" maxlength="6" style="flex:1;text-align:center;letter-spacing:6px;font-weight:bold;">
<button type="button" class="submit" style="width:auto;padding:13px 18px;background:#ff7100;" onclick="sendOtpForPassword()">إرسال</button>
</div>
<small id="setOtpStatus" style="color:#777;"></small>
</div>
<button class="submit" onclick="savePassword()">حفظ كلمة المرور</button>
</div></div>

<div id="privacyModal" class="modal"><div class="box">
<button class="close" onclick="closeModal('privacyModal')">×</button>
<h2>🔒 الخصوصية</h2>
<div style="padding:14px;background:#f4f4f4;border-radius:12px;"><b>رقم الهاتف:</b> <span id="privacyPhone">—</span></div>
</div></div>

<div id="ordersModal" class="modal"><div class="box">
<button class="close" onclick="closeModal('ordersModal')">×</button>
<h2>📦 منتجاتي</h2>
<div id="ordersList"></div>
</div></div>

<div id="messagesModal" class="modal"><div class="box">
<button class="close" onclick="closeModal('messagesModal')">×</button>
<h2>💬 الرسائل</h2>
<div id="chatsList"></div>
<div id="chatWindow" style="display:none;">
<button class="submit" style="background:#ccc;color:#333;margin-bottom:10px;" onclick="backToChats()">‹ رجوع</button>
<h3 id="chatWithName"></h3>
<div class="chat-window" id="chatMessages"></div>
<div class="chat-input">
<input id="chatInput" placeholder="رسالة..." onkeypress="if(event.key==='Enter')sendMessage()">
<button onclick="sendMessage()">إرسال</button>
</div>
</div>
</div></div>

<div id="appSettingsModal" class="modal"><div class="box">
<button class="close" onclick="closeModal('appSettingsModal')">×</button>
<h2>🛠️ إعدادات التطبيق</h2>
<div style="display:flex;justify-content:space-between;padding:12px;background:#f4f4f4;border-radius:10px;margin-bottom:10px;">
<span>🌙 الوضع المظلم</span>
<input id="darkToggle" type="checkbox" style="width:22px;height:22px;" onchange="toggleDarkMode()">
</div>
<button class="delete" onclick="deleteAccount()" style="margin-top:20px;">🗑️ حذف الحساب</button>
</div></div>

<div id="productModal" class="modal"><div class="box">
<button class="close" onclick="closeModal('productModal')">×</button>
<div id="productDetails"></div>
</div></div>

<script>
var products=[],users=[],currentCondition="جديد",currentCategory="الكل",currentImages=[],generatedOtp=null,currentUser=null,currentChatWith=null,passwordOtp=null;

function safeLoad(k,f){try{var v=localStorage.getItem(k);if(!v)return f;return JSON.parse(v);}catch(e){return f;}}
function safeSave(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function isAlgerianPhone(p){if(!p)return false;var c=p.replace(/\s+/g,"").replace(/-/g,"");return /^(\+213|213|0)(5|6|7)[0-9]{8}$/.test(c);}
function normalizeDzPhone(p){var c=p.replace(/\s+/g,"").replace(/-/g,"");if(c.indexOf("+213")===0)return c;if(c.indexOf("213")===0)return "+"+c;if(c.indexOf("0")===0)return "+213"+c.slice(1);return c;}
function closeModal(id){var m=document.getElementById(id);if(m)m.style.display="none";}
function showModal(id){var m=document.getElementById(id);if(m)m.style.display="flex";}

function filterCondition(cond){
currentCondition=cond;
["condAll","condNew","condUsed"].forEach(function(i){document.getElementById(i).classList.remove("active");});
if(cond==="الكل")document.getElementById("condAll").classList.add("active");
else if(cond==="جديد")document.getElementById("condNew").classList.add("active");
else document.getElementById("condUsed").classList.add("active");
currentCategory="الكل";
var cats=document.querySelectorAll("#categoriesBar button");
cats.forEach(function(b){b.classList.remove("active");});
if(cats[0])cats[0].classList.add("active");
searchProducts();
}

function filterCategory(cat,btn){
currentCategory=cat;
var cats=document.querySelectorAll("#categoriesBar button");
cats.forEach(function(b){b.classList.remove("active");});
if(btn)btn.classList.add("active");
searchProducts();
}

function openPublish(){
if(!currentUser){alert("سجّل الدخول أولًا");openAccountMenu();return;}
document.getElementById("pCondition").value=(currentCondition==="الكل")?"جديد":currentCondition;
showModal("publishModal");
}

function previewImages(event){
currentImages=[];
var preview=document.getElementById("preview");preview.innerHTML="";
var files=event.target.files;
Array.from(files).forEach(function(file){
if(!file.type.startsWith("image/"))return;
var reader=new FileReader();
reader.onload=function(e){currentImages.push(e.target.result);var img=document.createElement("img");img.src=e.target.result;preview.appendChild(img);};
reader.readAsDataURL(file);
});
}

function publishProduct(){
var name=document.getElementById("pName").value.trim();
var price=document.getElementById("pPrice").value;
var condition=document.getElementById("pCondition").value;
var category=document.getElementById("pCategory").value;
var location=document.getElementById("pLocation").value.trim();
var description=document.getElementById("pDescription").value.trim();
if(!name){alert("اكتب اسم المنتج");return;}
if(!price){alert("اكتب السعر");return;}
if(!location){alert("اكتب الولاية");return;}
if(currentImages.length===0){alert("اختر صورة");return;}
products.push({id:Date.now(),name:name,price:Number(price),condition:condition,category:category,location:location,description:description,images:currentImages.slice(),rating:0,reviews:[],ownerPhone:currentUser.phone,ownerName:currentUser.name,orders:0});
safeSave("marketDZ_products",products);
renderProducts();
closeModal("publishModal");
["pName","pPrice","pLocation","pDescription","pImages"].forEach(function(id){document.getElementById(id).value="";});
document.getElementById("preview").innerHTML="";
currentImages=[];
alert("✅ تم نشر المنتج");
}

function renderProducts(list){
if(!list)list=products;
var c=document.getElementById("products");c.innerHTML="";
if(list.length===0){c.innerHTML='<div class="empty">لا توجد منتجات</div>';return;}
list.forEach(function(p){
var img=(p.images&&p.images[0])?p.images[0]:"";
var cond=p.condition||"جديد";
var cls=(cond==="جديد")?"new":"used";
c.innerHTML+='<div class="card"><span class="badge-cond '+cls+'">'+cond+'</span><img src="'+img+'"><div class="info"><div class="title">'+p.name+'</div><div class="price">'+Number(p.price).toLocaleString()+' دج</div><div class="location">📍 '+p.location+' · '+p.category+'</div><br><button class="view" onclick="openProduct('+p.id+')">عرض</button></div></div>';
});
}

function openProduct(id){
var p=null;
products.forEach(function(x){if(x.id===id)p=x;});
if(!p)return;
var imgs="";
p.images.forEach(function(i){imgs+='<img class="product-image" src="'+i+'">';});
var revs="<p>لا توجد تعليقات.</p>";
if(p.reviews&&p.reviews.length>0){revs="";p.reviews.forEach(function(r){revs+='<div class="review"><strong>'+r.name+'</strong><p>'+r.text+'</p></div>';});}
var isOwner=currentUser&&currentUser.phone===p.ownerPhone;
var canContact=currentUser&&!isOwner;
var cond=p.condition||"جديد";
var h='<h2>'+p.name+'</h2>'+imgs+'<p style="padding:5px 12px;border-radius:20px;background:'+(cond==="جديد"?"#008653":"#ff7100")+';color:white;display:inline-block;font-weight:bold;">'+cond+'</p><h2 style="margin-top:10px;">'+Number(p.price).toLocaleString()+' دج</h2><p>📂 '+p.category+'</p><p>📍 '+p.location+'</p><p>👤 '+p.ownerName+'</p><br><p>'+p.description+'</p><hr><br><h3>التعليقات</h3>'+revs+'<div class="field"><input id="reviewName" placeholder="اسمك" value="'+(currentUser?currentUser.name:'')+'"></div><div class="field"><textarea id="reviewText" placeholder="تعليقك"></textarea></div><button class="submit" onclick="addReview('+p.id+')">نشر التعليق</button>';
if(canContact){h+='<button class="submit" style="background:#ff7100;margin-top:10px;" onclick="contactSeller(\''+p.ownerPhone+'\',\''+(p.ownerName||"").replace(/'/g,"")+'\')">💬 تواصل مع البائع</button>';}
if(isOwner){h+='<button class="delete" onclick="deleteProduct('+p.id+')">🗑️ حذف</button>';}
document.getElementById("productDetails").innerHTML=h;
showModal("productModal");
}

function addReview(id){
if(!currentUser){alert("سجّل الدخول");return;}
var p=null;products.forEach(function(x){if(x.id===id)p=x;});
if(!p)return;
var n=document.getElementById("reviewName").value.trim();
var t=document.getElementById("reviewText").value.trim();
if(!n||!t){alert("املأ الحقول");return;}
if(!p.reviews)p.reviews=[];
p.reviews.push({name:n,text:t});
safeSave("marketDZ_products",products);
openProduct(id);
}

function deleteProduct(id){
if(!confirm("حذف؟"))return;
products=products.filter(function(p){return p.id!==id;});
safeSave("marketDZ_products",products);
closeModal("productModal");
renderProducts();
}

function searchProducts(){
var v=document.getElementById("search").value.toLowerCase().trim();
var r=[];
products.forEach(function(p){
if(v&&p.name.toLowerCase().indexOf(v)===-1)return;
if(currentCondition!=="الكل"){var c=p.condition||"جديد";if(c!==currentCondition)return;}
if(currentCategory!=="الكل"&&p.category!==currentCategory)return;
r.push(p);
});
renderProducts(r);
}

function getUnreadCount(){
if(!currentUser)return 0;
var m=safeLoad("marketDZ_messages",[]);
var c=0;
m.forEach(function(x){if(x.to===currentUser.phone&&!x.read)c++;});
return c;
}

function openAccountMenu(){
if(!currentUser){showModal("loginModal");switchAuthTab("login");return;}
document.getElementById("menuName").textContent=currentUser.name||"المستخدم";
document.getElementById("menuPhone").textContent=currentUser.phone||"";
if(currentUser.avatar)document.getElementById("menuAvatar").src=currentUser.avatar;
var u=getUnreadCount();
var b=document.getElementById("unreadBadge");
if(u>0){b.style.display="inline-block";b.textContent=u;}else{b.style.display="none";}
showModal("accountModal");
}

function switchAuthTab(tab){
var tl=document.getElementById("tabLogin"),tr=document.getElementById("tabRegister");
if(tab==="login"){
document.getElementById("loginForm").style.display="block";
document.getElementById("registerForm").style.display="none";
tl.style.background="#008653";tl.style.color="white";tr.style.background="#ccc";tr.style.color="#333";
}else{
document.getElementById("loginForm").style.display="none";
document.getElementById("registerForm").style.display="block";
tr.style.background="#008653";tr.style.color="white";tl.style.background="#ccc";tl.style.color="#333";
}
}

function login(){
var p=document.getElementById("phone").value.trim();
var pw=document.getElementById("password").value;
if(!p||!pw){alert("أدخل البيانات");return;}
if(!isAlgerianPhone(p)){alert("❌ مسموح فقط بالأرقام الجزائرية (+213)");return;}
var np=normalizeDzPhone(p);
users=safeLoad("marketDZ_users",[]);
var f=null;
users.forEach(function(u){if(normalizeDzPhone(u.phone)===np)f=u;});
if(!f){alert("❌ لا يوجد حساب");return;}
if(f.password!==pw){alert("❌ كلمة المرور خاطئة");return;}
currentUser=f;
safeSave("marketDZ_currentUser",currentUser);
alert("✅ تم الدخول");
closeModal("loginModal");
}

function sendOtp(inputId,statusId){
var p=document.getElementById(inputId).value.trim();
if(!p){alert("أدخل الرقم");return;}
if(!isAlgerianPhone(p)){alert("❌ مسموح فقط بالأرقام الجزائرية");return;}
generatedOtp=Math.floor(100000+Math.random()*900000).toString();
document.getElementById(statusId).textContent="الرمز: "+generatedOtp;
alert("OTP: "+generatedOtp);
}

function register(){
var n=document.getElementById("regName").value.trim();
var p=document.getElementById("regPhone").value.trim();
var pw=document.getElementById("regPassword").value;
var pw2=document.getElementById("regPassword2").value;
var otp=document.getElementById("otpCode").value.trim();
if(!n||!p||!pw||!pw2){alert("املأ الحقول");return;}
if(!isAlgerianPhone(p)){alert("❌ مسموح فقط بالأرقام الجزائرية");return;}
if(pw!==pw2){alert("كلمتا المرور مختلفتان");return;}
if(!generatedOtp){alert("أرسل الرمز");return;}
if(otp!==generatedOtp){alert("رمز خاطئ");return;}
var np=normalizeDzPhone(p);
users=safeLoad("marketDZ_users",[]);
var ex=false;
users.forEach(function(u){if(normalizeDzPhone(u.phone)===np)ex=true;});
if(ex){alert("❌ الرقم مسجّل");return;}
var nu={name:n,phone:np,password:pw,avatar:"",createdAt:Date.now()};
users.push(nu);safeSave("marketDZ_users",users);
currentUser=nu;safeSave("marketDZ_currentUser",currentUser);
generatedOtp=null;
alert("🎉 تم إنشاء الحساب");
closeModal("loginModal");
}

function openProfile(){
document.getElementById("profileName").value=currentUser.name||"";
if(currentUser.avatar)document.getElementById("profileAvatar").src=currentUser.avatar;
showModal("profileModal");
}

function changeAvatar(event){
var f=event.target.files[0];if(!f)return;
var r=new FileReader();
r.onload=function(e){
document.getElementById("profileAvatar").src=e.target.result;
currentUser.avatar=e.target.result;
safeSave("marketDZ_currentUser",currentUser);
var us=safeLoad("marketDZ_users",[]);
us.forEach(function(u){if(u.phone===currentUser.phone)u.avatar=currentUser.avatar;});
safeSave("marketDZ_users",us);
};
r.readAsDataURL(f);
}

function saveProfile(){
var n=document.getElementById("profileName").value.trim();
if(!n){alert("اكتب الاسم");return;}
currentUser.name=n;
safeSave("marketDZ_currentUser",currentUser);
var us=safeLoad("marketDZ_users",[]);
us.forEach(function(u){if(u.phone===currentUser.phone)u.name=n;});
safeSave("marketDZ_users",us);
alert("✅ تم الحفظ");
closeModal("profileModal");
}

function openSettings(){
document.getElementById("setPhone").value=currentUser.phone||"";
showModal("settingsModal");
}

function savePhone(){
var p=document.getElementById("setPhone").value.trim();
if(!p){alert("أدخل الرقم");return;}
if(!isAlgerianPhone(p)){alert("❌ مسموح فقط بالأرقام الجزائرية");return;}
var np=normalizeDzPhone(p);
var op=currentUser.phone;
currentUser.phone=np;
safeSave("marketDZ_currentUser",currentUser);
var us=safeLoad("marketDZ_users",[]);
us.forEach(function(u){if(u.phone===op)u.phone=np;});
safeSave("marketDZ_users",us);
products.forEach(function(pr){if(pr.ownerPhone===op)pr.ownerPhone=np;});
safeSave("marketDZ_products",products);
alert("✅ تم تحديث الرقم");
}

function sendOtpForPassword(){
passwordOtp=Math.floor(100000+Math.random()*900000).toString();
document.getElementById("setOtpStatus").textContent="الرمز: "+passwordOtp;
alert("OTP: "+passwordOtp);
}

function savePassword(){
var pw=document.getElementById("setPassword").value.trim();
var otp=document.getElementById("setOtpCode").value.trim();
if(!pw){alert("اكتب كلمة المرور");return;}
if(!passwordOtp){alert("أرسل الرمز");return;}
if(otp!==passwordOtp){alert("رمز خاطئ");return;}
currentUser.password=pw;
safeSave("marketDZ_currentUser",currentUser);
var us=safeLoad("marketDZ_users",[]);
us.forEach(function(u){if(u.phone===currentUser.phone)u.password=pw;});
safeSave("marketDZ_users",us);
passwordOtp=null;
alert("✅ تم التحديث");
closeModal("settingsModal");
}

function openPrivacy(){
document.getElementById("privacyPhone").textContent=currentUser.phone||"—";
showModal("privacyModal");
}

function openOrders(){
var c=document.getElementById("ordersList");
var mp=products.filter(function(p){return p.ownerPhone===currentUser.phone;});
if(mp.length===0){c.innerHTML="<p style='color:#777;'>لا توجد منتجات</p>";return;}
c.innerHTML="";
mp.forEach(function(p){
c.innerHTML+='<div style="display:flex;gap:10px;padding:12px;background:#f4f4f4;border-radius:12px;margin-bottom:10px;"><img src="'+p.images[0]+'" style="width:60px;height:60px;border-radius:10px;object-fit:cover;"><div style="flex:1;"><b>'+p.name+'</b><div style="color:#008653;font-weight:bold;">'+Number(p.price).toLocaleString()+' دج</div><div style="color:#777;font-size:13px;">📦 '+p.category+' · '+p.condition+'</div></div></div>';
});
showModal("ordersModal");
}

function openMessages(){
var c=document.getElementById("chatsList");
var all=safeLoad("marketDZ_messages",[]);
var map={};
all.forEach(function(m){
if(m.from===currentUser.phone||m.to===currentUser.phone){
var op=(m.from===currentUser.phone)?m.to:m.from;
var on=(m.from===currentUser.phone)?m.toName:m.fromName;
if(!map[op])map[op]={phone:op,name:on,last:m.text};
else map[op].last=m.text;
}
});
var keys=Object.keys(map);
if(keys.length===0){c.innerHTML="<p style='color:#777;'>لا توجد رسائل</p>";}
else{
c.innerHTML="";
keys.forEach(function(k){
var x=map[k];
c.innerHTML+='<div class="chat-item" onclick="openChat(\''+x.phone+'\',\''+x.name+'\')"><img src="https://via.placeholder.com/60/008653/ffffff?text='+x.name.charAt(0)+'"><div style="flex:1;"><b>'+x.name+'</b><div class="msg-preview">'+x.last+'</div></div><span>›</span></div>';
});
}
document.getElementById("chatsList").style.display="block";
document.getElementById("chatWindow").style.display="none";
showModal("messagesModal");
}

function contactSeller(phone,name){
if(!currentUser){alert("سجّل الدخول");return;}
closeModal("productModal");
openMessages();
openChat(phone,name);
}

function openChat(phone,name){
currentChatWith={phone:phone,name:name};
document.getElementById("chatsList").style.display="none";
document.getElementById("chatWindow").style.display="block";
document.getElementById("chatWithName").textContent="💬 "+name;
renderChatMessages();
}

function backToChats(){openMessages();}

function renderChatMessages(){
var c=document.getElementById("chatMessages");
var all=safeLoad("marketDZ_messages",[]);
c.innerHTML="";
all.forEach(function(m){
if((m.from===currentUser.phone&&m.to===currentChatWith.phone)||(m.from===currentChatWith.phone&&m.to===currentUser.phone)){
var cls=(m.from===currentUser.phone)?"msg-me":"msg-other";
c.innerHTML+='<div class="'+cls+'">'+m.text+'</div>';
}
});
c.scrollTop=c.scrollHeight;
}

function sendMessage(){
var t=document.getElementById("chatInput").value.trim();
if(!t)return;
var all=safeLoad("marketDZ_messages",[]);
all.push({from:currentUser.phone,fromName:currentUser.name,to:currentChatWith.phone,toName:currentChatWith.name,text:t,time:Date.now(),read:false});
safeSave("marketDZ_messages",all);
document.getElementById("chatInput").value="";
renderChatMessages();
}

function openAppSettings(){showModal("appSettingsModal");}

function toggleDarkMode(){
var on=document.getElementById("darkToggle").checked;
if(on){
document.body.style.background="#1e1e1e";
document.body.style.color="#eee";
document.querySelectorAll(".card,.box,.categories button,.search input,.menu-item,.chat-item,.review").forEach(function(el){el.style.background="#2a2a2a";el.style.color="#eee";});
}else{
document.body.style.background="#f5f6f7";
document.body.style.color="#222";
document.querySelectorAll(".card,.box,.categories button,.search input,.menu-item,.chat-item,.review").forEach(function(el){el.style.background="";el.style.color="";});
}
localStorage.setItem("marketDZ_dark",on?"1":"0");
}

function deleteAccount(){
if(!confirm("⚠️ حذف الحساب؟"))return;
var us=safeLoad("marketDZ_users",[]);
us=us.filter(function(u){return u.phone!==currentUser.phone;});
safeSave("marketDZ_users",us);
localStorage.removeItem("marketDZ_currentUser");
currentUser=null;
alert("تم الحذف");
closeModal("appSettingsModal");
}

function logout(){
if(!confirm("خروج؟"))return;
currentUser=null;
localStorage.removeItem("marketDZ_currentUser");
alert("تم الخروج");
closeModal("accountModal");
}

function loadProducts(){
var saved=localStorage.getItem("marketDZ_products");
if(saved){try{products=JSON.parse(saved);}catch(e){products=[];}}
}

loadProducts();
renderProducts();

if(localStorage.getItem("marketDZ_dark")==="1"){
document.getElementById("darkToggle").checked=true;
toggleDarkMode();
}
</script>
</body>
</html>
